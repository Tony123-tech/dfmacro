[package]
name = "dfmacro_rs"
version = "0.0.1"
edition = "2021"

[lib]
name = "dfmacro_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"
ndarray = "0.16"
rayon = "1.10"
regex = "1.10"
chrono = "0.4"
pyo3-arrow = { version = "0.5", default-features = false }
arrow-array = "53"
arrow-schema = "53"
ahash = "0.8"
